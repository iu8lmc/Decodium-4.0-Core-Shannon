name: Build Windows + SignPath Code Signing

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  BUILD_TAG: ${{ github.run_number }}
  HAMLIB_TAG: "4.7.0"
  HAMLIB_VERSION: "4.7.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-shadertools
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-activeqt
            mingw-w64-x86_64-qt6-translations
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-boost

      - name: Restore Hamlib cache
        id: hamlib-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\.ci\hamlib-mingw64
          key: windows-mingw64-hamlib-${{ env.HAMLIB_VERSION }}
          restore-keys: |
            windows-mingw64-hamlib-

      - name: Build and install Hamlib
        if: steps.hamlib-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          HAMLIB_PREFIX="$(cygpath -u "$GITHUB_WORKSPACE")/.ci/hamlib-mingw64"
          mkdir -p "${HAMLIB_PREFIX}"
          curl -fsSL -o "hamlib-${HAMLIB_VERSION}.tar.gz" \
            "https://github.com/Hamlib/Hamlib/releases/download/${HAMLIB_TAG}/hamlib-${HAMLIB_VERSION}.tar.gz"
          tar -xzf "hamlib-${HAMLIB_VERSION}.tar.gz"
          cd "hamlib-${HAMLIB_VERSION}"
          ./configure --prefix="${HAMLIB_PREFIX}" --disable-static --enable-shared
          make -j"$(nproc)"
          make install

      - name: Save Hamlib cache
        if: steps.hamlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\.ci\hamlib-mingw64
          key: windows-mingw64-hamlib-${{ env.HAMLIB_VERSION }}

      - name: Export Hamlib environment
        run: |
          set -euo pipefail
          HAMLIB_PREFIX="$(cygpath -u "$GITHUB_WORKSPACE")/.ci/hamlib-mingw64"
          HAMLIB_INCLUDE_DIR="${HAMLIB_PREFIX}/include"
          HAMLIB_LIBRARY="$(find "${HAMLIB_PREFIX}/lib" -maxdepth 1 \( -name 'libhamlib*.dll.a' -o -name 'libhamlib*.a' -o -name 'libhamlib*.dll' \) | sort | head -n1)"
          RIGCTL_EXE="${HAMLIB_PREFIX}/bin/rigctl"
          RIGCTLD_EXE="${HAMLIB_PREFIX}/bin/rigctld"
          RIGCTLCOM_EXE="${HAMLIB_PREFIX}/bin/rigctlcom"

          test -f "${HAMLIB_INCLUDE_DIR}/hamlib/rig.h"
          test -n "${HAMLIB_LIBRARY}"
          test -x "${RIGCTL_EXE}"

          echo "$(cygpath -w "${HAMLIB_PREFIX}/bin")" >> "${GITHUB_PATH}"
          echo "HAMLIB_PREFIX=${HAMLIB_PREFIX}" >> "${GITHUB_ENV}"
          echo "HAMLIB_INCLUDE_DIR=${HAMLIB_INCLUDE_DIR}" >> "${GITHUB_ENV}"
          echo "HAMLIB_LIBRARY=${HAMLIB_LIBRARY}" >> "${GITHUB_ENV}"
          echo "RIGCTL_EXE=${RIGCTL_EXE}" >> "${GITHUB_ENV}"
          echo "RIGCTLD_EXE=${RIGCTLD_EXE}" >> "${GITHUB_ENV}"
          echo "RIGCTLCOM_EXE=${RIGCTLCOM_EXE}" >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_PATH=${HAMLIB_PREFIX}/lib/pkgconfig:/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig" >> "${GITHUB_ENV}"
          "${HAMLIB_PREFIX}/bin/rigctl" --version

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          else
            VER="0.0.${BUILD_TAG}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"

      - name: Configure CMake
        run: |
          set -euo pipefail
          cmake --version
          ninja --version
          g++ --version
          test -f "${HAMLIB_INCLUDE_DIR}/hamlib/rig.h"
          test -n "${HAMLIB_LIBRARY}"
          test -x "${RIGCTL_EXE}"
          cmake -S . -B build-windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${HAMLIB_PREFIX};/mingw64" \
            -DHamlib_INCLUDE_DIR="${HAMLIB_INCLUDE_DIR}" \
            -DHamlib_LIBRARY="${HAMLIB_LIBRARY}" \
            -DRIGCTL_EXE="${RIGCTL_EXE}" \
            -DRIGCTLD_EXE="${RIGCTLD_EXE}" \
            -DRIGCTLCOM_EXE="${RIGCTLCOM_EXE}" \
            -DBUILD_TESTING=OFF \
            -DWSJT_GENERATE_DOCS=OFF \
            -DWSJT_SKIP_MANPAGES=ON \
            -DWSJT_BUILD_UTILS=OFF

      - name: Gate - build & run FT2-Link tests
        run: |
          set -euo pipefail
          cmake -S . -B build-ft2link-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${HAMLIB_PREFIX};/mingw64" -DBUILD_TESTING=ON -DWSJT_GENERATE_DOCS=OFF -DWSJT_SKIP_MANPAGES=ON -DWSJT_BUILD_UTILS=OFF
          cmake --build build-ft2link-tests --target ft2link_core test_ft2link test_ft2link_qml_adapter --parallel "$(nproc)"
          ctest --test-dir build-ft2link-tests -R '^(test_ft2link|test_ft2link_qml_adapter)$' --output-on-failure

      - name: Build application
        run: |
          set -euo pipefail
          cmake --build build-windows --target decodium_app --parallel "$(nproc)"

      - name: Prepare distribution
        run: |
          DIST="dist-windows-x64"
          mkdir -p "$DIST"

          # Copy main executable
          cp build-windows/decodium.exe "$DIST/"

          # Copy QML files
          cp -R build-windows/qml "$DIST/"

          # Qt6 and MinGW DLLs
          QTDIR="/mingw64"

          # Qt6 core DLLs
          for dll in Qt6Core Qt6Gui Qt6Widgets Qt6Network Qt6Multimedia \
                     Qt6MultimediaWidgets Qt6SerialPort Qt6WebSockets \
                     Qt6Sql Qt6Svg Qt6PrintSupport Qt6Qml Qt6QmlModels \
                     Qt6Quick Qt6QuickControls2 Qt6QuickControls2Impl \
                     Qt6QuickLayouts Qt6QuickTemplates2 Qt6QmlWorkerScript \
                     Qt6OpenGL Qt6ShaderTools Qt6Core5Compat; do
            [ -f "$QTDIR/bin/${dll}.dll" ] && cp "$QTDIR/bin/${dll}.dll" "$DIST/" 2>/dev/null || true
          done

          # MinGW runtime DLLs
          cp "$QTDIR"/bin/libgcc_s_*.dll "$QTDIR"/bin/libstdc++-6.dll \
             "$QTDIR"/bin/libwinpthread-1.dll "$DIST/" 2>/dev/null || true
          cp "$QTDIR"/bin/libgfortran-5.dll "$QTDIR"/bin/libgomp-1.dll \
             "$QTDIR"/bin/libquadmath-0.dll "$DIST/" 2>/dev/null || true

          # Other required DLLs
          for dll in libfftw3f-3 libfftw3f_threads-3 libhamlib-4 libusb-1.0 \
                     zlib1 libbz2-1 liblzma-5 libpcre2-8-0 libpcre2-16-0 \
                     libpng16-16 libjpeg-8 libfreetype-6 libharfbuzz-0 libgraphite2 \
                     libiconv-2 libintl-8 libglib-2.0-0 libmd4c libdouble-conversion \
                     libbrotlicommon libbrotlidec libzstd libcrypto-3-x64 libssl-3-x64; do
            [ -f "$QTDIR/bin/${dll}.dll" ] && cp "$QTDIR/bin/${dll}.dll" "$DIST/" 2>/dev/null || true
          done
          cp "${HAMLIB_PREFIX}"/bin/libhamlib-*.dll "$DIST/" 2>/dev/null || true

          # ICU DLLs
          cp "$QTDIR"/bin/libicu*.dll "$DIST/" 2>/dev/null || true

          # Qt6 plugins
          mkdir -p "$DIST"/{platforms,audio,imageformats,sqldrivers,styles,multimedia,tls,networkinformation,qmltooling}
          cp "$QTDIR"/share/qt6/plugins/platforms/qwindows.dll "$DIST/platforms/" 2>/dev/null || true
          cp "$QTDIR"/share/qt6/plugins/audio/*.dll "$DIST/audio/" 2>/dev/null || true
          cp "$QTDIR"/share/qt6/plugins/imageformats/*.dll "$DIST/imageformats/" 2>/dev/null || true
          cp "$QTDIR"/share/qt6/plugins/sqldrivers/*.dll "$DIST/sqldrivers/" 2>/dev/null || true
          cp "$QTDIR"/share/qt6/plugins/styles/*.dll "$DIST/styles/" 2>/dev/null || true
          cp "$QTDIR"/share/qt6/plugins/multimedia/*.dll "$DIST/multimedia/" 2>/dev/null || true
          cp "$QTDIR"/share/qt6/plugins/tls/*.dll "$DIST/tls/" 2>/dev/null || true
          cp "$QTDIR"/share/qt6/plugins/networkinformation/*.dll "$DIST/networkinformation/" 2>/dev/null || true

          # Qt6 QML modules (system)
          mkdir -p "$DIST/qml"
          for mod in QtQml QtQuick Qt; do
            [ -d "$QTDIR/share/qt6/qml/$mod" ] && cp -R "$QTDIR/share/qt6/qml/$mod" "$DIST/qml/" 2>/dev/null || true
          done

          # Data files
          cp cty.dat sat.dat "$DIST/" 2>/dev/null || true

          echo "=== Distribution contents ==="
          find "$DIST" -name "*.exe" | sort
          echo "Total files: $(find "$DIST" -type f | wc -l)"
          du -sh "$DIST"

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: decodium-unsigned-x64
          if-no-files-found: error
          path: dist-windows-x64

  sign:
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Download unsigned artifact
        uses: actions/download-artifact@v4
        with:
          name: decodium-unsigned-x64
          path: unsigned-x64

      - name: Repackage for SignPath
        run: |
          cd unsigned-x64
          zip -r ../decodium-x64.zip .

      - name: Upload artifact for SignPath
        id: upload-for-signing
        uses: actions/upload-artifact@v4
        with:
          name: decodium-to-sign-x64
          path: decodium-x64.zip

      - name: Submit signing request to SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'decodium'
          signing-policy-slug: >-
            ${{ startsWith(github.ref, 'refs/tags/')
                && 'release-signing'
                || 'test-signing' }}
          github-artifact-id: '${{ steps.upload-for-signing.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed-x64'

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: decodium-signed-x64
          path: signed-x64
          if-no-files-found: error

  package:
    needs: sign
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout (for installer scripts)
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          $TAG = "$env:GITHUB_REF" -replace '^refs/tags/',''
          $VER = $TAG -replace '^v',''
          echo "version=$VER" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Download signed x64
        uses: actions/download-artifact@v4
        with:
          name: decodium-signed-x64
          path: dist-windows-x64

      - name: Build installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion="${{ steps.version.outputs.version }}" `
            /DBuildDir="dist-windows-x64" `
            /DSourceRoot="." `
            /DOutputDir="installer\output" `
            /DOutputBaseFilename="Decodium_${{ steps.version.outputs.version }}_Setup_x64" `
            "installer\decodium_setup.iss"
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: decodium-installer
          path: installer/output/Decodium_*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/Decodium_*.exe
          draft: false
          generate_release_notes: true
