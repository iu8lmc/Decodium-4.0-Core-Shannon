name: Test Runner

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/ft2link/**'
      - 'controllers/FT2Link*'
      - 'tests/test_ft2link*'
      - 'CMakeLists.txt'
      - '.github/workflows/test-runner.yml'
  push:
    paths:
      - 'lib/ft2link/**'
      - 'controllers/FT2Link*'
      - 'tests/test_ft2link*'
      - 'CMakeLists.txt'
      - '.github/workflows/test-runner.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ft2link-macos:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          brew update
          brew install qt gcc fftw libusb boost hamlib pkg-config libomp

          echo "$(brew --prefix qt)/bin" >> "${GITHUB_PATH}"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt);$(brew --prefix hamlib);$(brew --prefix libomp)" >> "${GITHUB_ENV}"

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build-ft2link \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
            -DBUILD_TESTING=ON \
            -DWSJT_GENERATE_DOCS=OFF \
            -DWSJT_SKIP_MANPAGES=ON \
            -DWSJT_BUILD_UTILS=OFF

      - name: Build FT2-Link tests
        run: |
          set -euo pipefail
          cmake --build build-ft2link \
            --target ft2link_core test_ft2link test_ft2link_qml_adapter \
            --parallel "$(sysctl -n hw.ncpu)"

      - name: Run FT2-Link tests
        run: |
          set -euo pipefail
          ctest --test-dir build-ft2link \
            -R '^(test_ft2link|test_ft2link_qml_adapter)$' \
            --output-on-failure

  ft2link-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            gfortran \
            cmake \
            ninja-build \
            pkg-config \
            libboost-filesystem-dev \
            libboost-log-dev \
            libboost-thread-dev \
            libfftw3-dev \
            libhamlib-dev \
            libomp-dev \
            libreadline-dev \
            libusb-1.0-0-dev \
            portaudio19-dev \
            qt6-5compat-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qt6-multimedia-dev \
            qt6-serialport-dev \
            qt6-shadertools-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libqt6svg6-dev \
            libqt6websockets6-dev

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build-ft2link -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DWSJT_GENERATE_DOCS=OFF \
            -DWSJT_SKIP_MANPAGES=ON \
            -DWSJT_BUILD_UTILS=OFF

      - name: Build FT2-Link tests
        run: |
          set -euo pipefail
          cmake --build build-ft2link \
            --target ft2link_core test_ft2link test_ft2link_qml_adapter \
            --parallel "$(nproc)"

      - name: Run FT2-Link tests
        run: |
          set -euo pipefail
          ctest --test-dir build-ft2link \
            -R '^(test_ft2link|test_ft2link_qml_adapter)$' \
            --output-on-failure

  ft2link-windows:
    runs-on: windows-2022
    timeout-minutes: 60

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            git
            make
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-hamlib
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-activeqt
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-translations
            mingw-w64-x86_64-qt6-websockets

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build-ft2link -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DBUILD_TESTING=ON \
            -DWSJT_GENERATE_DOCS=OFF \
            -DWSJT_SKIP_MANPAGES=ON \
            -DWSJT_BUILD_UTILS=OFF

      - name: Build FT2-Link tests
        run: |
          set -euo pipefail
          cmake --build build-ft2link \
            --target ft2link_core test_ft2link test_ft2link_qml_adapter \
            --parallel "$(nproc)"

      - name: Run FT2-Link tests
        run: |
          set -euo pipefail
          ctest --test-dir build-ft2link \
            -R '^(test_ft2link|test_ft2link_qml_adapter)$' \
            --output-on-failure
