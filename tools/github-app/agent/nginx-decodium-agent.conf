# Instradamento del webhook di decodium-agent su groups.ft2.it
#
# ATTENZIONE ALL'ORDINE. Oggi groups.ft2.it risponde:
#     POST https://groups.ft2.it/decodium-agent/webhook
#       -> 301 https://community.ft2.it/groups
# cioe' reindirizza e per giunta perde il percorso. GitHub NON segue i
# reindirizzamenti quando consegna un webhook: registra il 3xx come consegna
# fallita. Questo blocco deve quindi precedere la regola che reindirizza, oppure
# stare in una location piu' specifica: in nginx una location con prefisso piu'
# lungo vince sulle altre di pari tipo, ma un "return 301" dentro il server o
# dentro "location /" viene comunque scavalcato solo se questo blocco esiste.
#
# Da inserire nel server { } che serve groups.ft2.it in HTTPS.

location = /decodium-agent/webhook {
    proxy_pass http://127.0.0.1:8787/decodium-agent/webhook;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Le intestazioni che portano firma ed evento sono la ragione di tutto:
    # senza di esse il servizio rifiuta, giustamente, ogni consegna.
    proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    proxy_set_header X-GitHub-Event      $http_x_github_event;
    proxy_set_header X-GitHub-Delivery   $http_x_github_delivery;

    proxy_read_timeout 30s;
    client_max_body_size 8m;

    # Solo POST: qualunque altro metodo su questo percorso e' rumore.
    limit_except POST { deny all; }
}

location = /decodium-agent/health {
    proxy_pass http://127.0.0.1:8787/health;
    proxy_set_header Host $host;
    access_log off;
}
